.empty{

.weekHead{

  cursor:pointer;
}

.weekTitle{

  color:#f5d76e;

}

.hint{
  text-align:center;
  color:#94a3b8;
  font-size:12px;
  margin:6px 0 10px;
}

.weekTotals{

  text-align:center;

}
