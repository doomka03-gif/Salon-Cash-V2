name: Build Salon Cash V3

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Android Project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/saloncash/app
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable-nodpi

          cp index.html app/src/main/assets/index.html

          echo 'pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }' > settings.gradle
          echo 'dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }' >> settings.gradle
          echo 'rootProject.name = "SalonCash"' >> settings.gradle
          echo 'include(":app")' >> settings.gradle

          printf '%s\n' \
          'plugins {' \
          "    id 'com.android.application' version '8.5.2' apply false" \
          '}' > build.gradle

          printf '%s\n' \
          "plugins { id 'com.android.application' }" \
          '' \
          'android {' \
          "    namespace 'com
